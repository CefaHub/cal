<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Наш календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #708499);
    --link: var(--tg-theme-link-color, #6ab2f2);
    --btn: var(--tg-theme-button-color, #5288c1);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary: var(--tg-theme-secondary-bg-color, #232e3c);
    --accent: var(--tg-theme-accent-text-color, #6ab2f2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }
  body { padding: 16px; padding-bottom: 40px; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 20px;
  }
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .nav button {
    background: var(--secondary);
    color: var(--text);
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 18px;
    cursor: pointer;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav button:active { opacity: 0.6; }
  .nav .month-label {
    font-size: 16px;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 24px;
  }
  .grid .dow {
    text-align: center;
    font-size: 12px;
    color: var(--hint);
    padding: 6px 0;
    font-weight: 500;
  }
  .grid .day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 14px;
    background: var(--secondary);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .grid .day.empty {
    background: transparent;
    cursor: default;
  }
  .grid .day.today {
    outline: 2px solid var(--accent);
    font-weight: 700;
  }
  .grid .day.selected {
    outline: 2px solid #f06292;
    font-weight: 700;
  }
  .grid .day.has-event {
    background: linear-gradient(135deg, #5288c1 0%, #6ab2f2 100%);
    color: #fff;
  }
  .grid .day.has-event.anniversary {
    background: linear-gradient(135deg, #e91e63 0%, #f06292 100%);
  }
  .grid .day.has-event.birthday {
    background: linear-gradient(135deg, #ff9800 0%, #ffb74d 100%);
  }
  .grid .day.has-event.wedding {
    background: linear-gradient(135deg, #9c27b0 0%, #ba68c8 100%);
  }
  .grid .day .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    margin-top: 2px;
  }
  .grid .day .num {
    font-size: 14px;
    line-height: 1;
  }
  .events-list {
    margin-top: 8px;
  }
  .events-list h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    padding-left: 4px;
  }
  .event-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    background: var(--secondary);
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .event-item .icon {
    font-size: 20px;
    line-height: 1;
    flex-shrink: 0;
  }
  .event-item .info { flex: 1; }
  .event-item .info .title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .event-item .info .date {
    font-size: 12px;
    color: var(--hint);
  }
  .event-item.past { opacity: 0.5; }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--hint);
    font-size: 14px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    font-size: 12px;
    color: var(--hint);
    margin-top: 16px;
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot-color {
    width: 10px; height: 10px; border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="loading" id="loading">Загрузка календаря…</div>

  <div id="app" style="display:none">
    <h1>Наш календарь</h1>
    <div class="subtitle" id="subtitle">Москва ⇄ Омск, но сердце всегда рядом 💕</div>

    <div class="nav">
      <button id="prevMonth">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth">›</button>
    </div>

    <div class="grid" id="grid">
      <div class="dow">Пн</div><div class="dow">Вт</div><div class="dow">Ср</div>
      <div class="dow">Чт</div><div class="dow">Пт</div><div class="dow">Сб</div>
      <div class="dow">Вс</div>
    </div>

    <div class="legend">
      <span><span class="dot-color" style="background:#e91e63"></span>Годовщины</span>
      <span><span class="dot-color" style="background:#ff9800"></span>Дни рождения</span>
      <span><span class="dot-color" style="background:#9c27b0"></span>Свадьба</span>
    </div>

    <div class="events-list">
      <h2 id="eventsTitle">Ближайшие события</h2>
      <div id="events"></div>
    </div>
  </div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor('secondary_bg_color');
  if (tg.setBackgroundColor) tg.setBackgroundColor('bg_color');
}

// ─── Данные ───────────────────────────────────────────────────
let events = [];
const params = new URLSearchParams(window.location.search);
const eventsParam = params.get('events');
if (eventsParam) {
  try { events = JSON.parse(decodeURIComponent(eventsParam)); } catch(e) {
    console.error('Не удалось распарсить events:', e);
  }
}

// Заглушка на случай пустых данных
if (!Array.isArray(events) || events.length === 0) {
  events = [
    { date: '2026-05-15', title: 'Начало отношений', type: 'anniversary', emoji: '❤️' },
    { date: '2026-07-15', title: 'Свадьба', type: 'wedding', emoji: '💕' },
    { date: '2026-03-04', title: 'Её день рождения', type: 'birthday', emoji: '🎀' },
    { date: '2026-09-21', title: 'Его день рождения', type: 'birthday', emoji: '✨' },
  ];
}

// ─── Рендер ───────────────────────────────────────────────────
const monthsRu = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                  'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const monthsShort = ['янв','фев','мар','апр','мая','июн',
                     'июл','авг','сен','окт','ноя','дек'];

let currentDate = new Date();
let selectedDate = null;

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function toIso(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
      && a.getMonth() === b.getMonth()
      && a.getDate() === b.getDate();
}

function eventsOnDate(d) {
  const iso = toIso(d);
  const mmdd = iso.slice(5);
  return events.filter(e => {
    const eDate = (e.date || '').slice(0, 10);
    return eDate === iso || eDate.slice(5) === mmdd;
  });
}

function nextOccurrence(e) {
  const [y, m, dd] = (e.date || '').slice(0,10).split('-').map(Number);
  const today = new Date();
  today.setHours(0,0,0,0);
  let next = new Date(today.getFullYear(), m - 1, dd);
  if (next < today) next = new Date(today.getFullYear() + 1, m - 1, dd);
  return next;
}

function render() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById('monthLabel').textContent =
    monthsRu[month] + ' ' + year;

  const grid = document.getElementById('grid');
  while (grid.children.length > 7) grid.removeChild(grid.lastChild);

  const first = new Date(year, month, 1);
  let startDow = first.getDay() - 1;
  if (startDow < 0) startDow = 6;

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < startDow; i++) {
    const el = document.createElement('div');
    el.className = 'day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'day';
    const dt = new Date(year, month, d);

    if (sameDay(dt, today)) el.classList.add('today');
    if (selectedDate && sameDay(dt, selectedDate)) el.classList.add('selected');

    const evs = eventsOnDate(dt);
    if (evs.length) {
      el.classList.add('has-event');
      if (evs.some(e => e.type === 'anniversary')) el.classList.add('anniversary');
      if (evs.some(e => e.type === 'birthday')) el.classList.add('birthday');
      if (evs.some(e => e.type === 'wedding')) el.classList.add('wedding');
    }

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;
    el.appendChild(num);

    if (evs.length) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      el.appendChild(dot);
    }

    el.onclick = () => {
      selectedDate = dt;
      render();
      showDayEvents(dt);
    };

    grid.appendChild(el);
  }

  renderEventsList();
}

function showDayEvents(dt) {
  const evs = eventsOnDate(dt);
  const titleEl = document.getElementById('eventsTitle');
  titleEl.textContent = 'События ' + dt.getDate() + ' ' + monthsShort[dt.getMonth()];

  const evEl = document.getElementById('events');
  evEl.innerHTML = '';

  if (!evs.length) {
    evEl.innerHTML = '<div class="event-item"><div class="info"><div class="title">Нет событий</div></div></div>';
    return;
  }

  evs.forEach(e => {
    const item = document.createElement('div');
    item.className = 'event-item';
    item.innerHTML =
      '<div class="icon">' + (e.emoji || '📅') + '</div>' +
      '<div class="info">' +
        '<div class="title">' + e.title + '</div>' +
      '</div>';
    evEl.appendChild(item);
  });
}

function renderEventsList() {
  document.getElementById('eventsTitle').textContent = 'Ближайшие события';
  const today = new Date();
  today.setHours(0,0,0,0);

  const sorted = events
    .map(e => ({ ...e, nextDate: nextOccurrence(e) }))
    .sort((a, b) => a.nextDate - b.nextDate)
    .slice(0, 10);

  const evEl = document.getElementById('events');
  evEl.innerHTML = '';

  sorted.forEach(e => {
    const item = document.createElement('div');
    item.className = 'event-item';
    const daysLeft = Math.round((e.nextDate - today) / 86400000);
    const dateStr = e.nextDate.getDate() + ' ' + monthsShort[e.nextDate.getMonth()];
    const daysStr = daysLeft === 0 ? 'сегодня'
                  : daysLeft === 1 ? 'завтра'
                  : 'через ' + daysLeft + ' дн.';
    item.innerHTML =
      '<div class="icon">' + (e.emoji || '📅') + '</div>' +
      '<div class="info">' +
        '<div class="title">' + e.title + '</div>' +
        '<div class="date">' + dateStr + ' — ' + daysStr + '</div>' +
      '</div>';
    evEl.appendChild(item);
  });
}

document.getElementById('prevMonth').onclick = () => {
  currentDate.setMonth(currentDate.getMonth() - 1);
  render();
};
document.getElementById('nextMonth').onclick = () => {
  currentDate.setMonth(currentDate.getMonth() + 1);
  render();
};

document.getElementById('loading').style.display = 'none';
document.getElementById('app').style.display = 'block';
render();
</script>
</body>
</html>
